<style>
:root{
  --bg:#f4f5f2; --surface:#ffffff; --fg:#1c231f; --muted:#6b736d; --line:#e2e6e0;
  --accent:#2c6a4d; --input:#f8faf7; --today:#e8f1eb; --loss:#b23a30; --profit:#1d7a4b;
  --c-inc:#1d7a4b; --c-exp:#b23a30; --c-sab:#a8691a; --c-hot:#2b6cb0;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --surface:#18201b; --fg:#e6ece7; --muted:#97a39c; --line:#28322c;
    --accent:#7cc39a; --input:#131b16; --today:#1d2a21; --loss:#ef7f73; --profit:#6fcf97;
    --c-inc:#6fcf97; --c-exp:#ef7f73; --c-sab:#e0b060; --c-hot:#7fb2ea;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#18201b; --fg:#e6ece7; --muted:#97a39c; --line:#28322c;
  --accent:#7cc39a; --input:#131b16; --today:#1d2a21; --loss:#ef7f73; --profit:#6fcf97;
  --c-inc:#6fcf97; --c-exp:#ef7f73; --c-sab:#e0b060; --c-hot:#7fb2ea;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:'Hind Siliguri',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.navbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center}
.mtitle{font-weight:700;font-size:17px;text-align:center}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero .lbl{color:var(--muted);font-size:13px}
.big{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 12px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{border-radius:12px;padding:8px 6px;background:var(--input);border:1px solid var(--line);min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:13px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--fg);font-variant-numeric:tabular-nums}
.pos{color:var(--profit)}
.neg{color:var(--loss)}
.big.pos,.big.neg{color:inherit}
.big.pos{color:var(--profit)}
.big.neg{color:var(--loss)}

.cathead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 2px 8px}
.cathead h2{font-size:17px;margin:0;font-weight:700}
.cathead span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}

.list{display:flex;flex-direction:column;gap:6px}
.day{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.day.today{background:var(--today);border-color:var(--accent)}
.dd{display:flex;flex-direction:column;min-width:0}
.dd b{font-size:16px;font-variant-numeric:tabular-nums}
.dd small{font-size:12px;color:var(--muted)}
.day input{width:132px;text-align:right;font-size:16px;font-variant-numeric:tabular-nums;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--fg)}
.day input::placeholder{color:var(--muted)}

.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{border:0;background:none;padding:8px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.tabs button i{width:10px;height:10px;border-radius:50%;background:var(--c);display:block}
.tabs button[aria-pressed="true"]{color:var(--fg);font-weight:700;background:var(--input)}

.fixrow{display:flex;justify-content:center;margin:14px 0 0}
.ghostbtn{background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:12px;padding:10px 14px}
dialog{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:18px;width:min(440px,calc(100% - 32px));padding:16px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dhead h2{margin:0;font-size:17px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 110px 36px;gap:8px;margin-bottom:8px}
.frow input{font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.frow input[type="number"]{text-align:right}
.del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;width:36px;height:36px;font-size:18px;line-height:1;padding:0}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <button class="navbtn" id="prev" aria-label="আগের মাস">‹</button>
    <div class="mtitle" id="mtitle"></div>
    <button class="navbtn" id="next" aria-label="পরের মাস">›</button>
  </header>

  <section class="hero" aria-label="সারাংশ">
    <div class="lbl">মাসের নিট লাভ / লোকসান</div>
    <div class="big" id="netBig">—</div>
    <div class="stats">
      <div class="stat"><span>আমদানি</span><b id="s-inc">—</b></div>
      <div class="stat"><span>খরচ</span><b id="s-exp">—</b></div>
      <div class="stat"><span>সাবাকা</span><b id="s-sab">—</b></div>
      <div class="stat"><span>হোটেল</span><b id="s-hot">—</b></div>
    </div>
    <div class="meta">
      <span>মাসিক খরচ: <b id="sFix">—</b></span>
      <span>আজকের ফল: <b id="todayNet">—</b></span>
    </div>
  </section>

  <div class="cathead"><h2 id="catName"></h2><span id="catTotal"></span></div>
  <main class="list" id="list"></main>

  <div class="fixrow"><button class="ghostbtn" id="fixBtn" type="button">মাসিক খরচ সম্পাদনা</button></div>
  <p class="note">নিট = আমদানি + সাবাকা + হোটেল − খরচ − মাসিক খরচ। তথ্য এই ব্রাউজারেই সংরক্ষিত থাকে।</p>
</div>

<nav class="tabs" id="tabs" aria-label="খরচের ধরন"></nav>

<dialog id="fixDlg">
  <div class="dhead">
    <h2>মাসিক খরচ</h2>
    <button class="ghostbtn" id="closeFix" type="button">বন্ধ</button>
  </div>
  <div id="fixList"></div>
  <button class="ghostbtn" id="addFix" type="button">+ খরচ যোগ করুন</button>
</dialog>

<script>
const KEY = 'shop-ledger-v1';
const CATS = [
  { k: 'inc', n: 'আমদানি' },
  { k: 'exp', n: 'খরচ' },
  { k: 'sab', n: 'সাবাকা' },
  { k: 'hot', n: 'হোটেল' }
];
const nf = new Intl.NumberFormat('bn-BD', { maximumFractionDigits: 0 });
const $ = id => document.getElementById(id);

const T = (() => {
  const t = new Date();
  return { ym: t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0'), day: t.getDate() };
})();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === 'object' && s.months) return s;
  } catch (e) {}
  return { months: {} };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

let state = load();
let view = { ym: T.ym, cat: 'inc' };

function md() {
  const k = view.ym;
  if (!state.months[k]) {
    const prev = Object.keys(state.months).filter(x => x < k).sort().pop();
    const fixed = prev ? state.months[prev].fixed.map(f => ({ name: f.name, amount: f.amount })) : [];
    state.months[k] = { days: {}, fixed };
  }
  return state.months[k];
}
function num(v) { const n = parseFloat(v); return isFinite(n) ? n : 0; }
function fmt(n) { return (n < 0 ? '−' : '') + '৳ ' + nf.format(Math.abs(n)); }
function classFor(n) { return n > 0 ? 'pos' : n < 0 ? 'neg' : ''; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function daysIn(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function shift(ym, delta) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function dayNet(r) { return num(r.inc) + num(r.sab) + num(r.hot) - num(r.exp); }

function totals() {
  const m = md(), n = daysIn(view.ym);
  const t = { inc: 0, exp: 0, sab: 0, hot: 0 };
  for (let d = 1; d <= n; d++) {
    const r = m.days[d] || {};
    CATS.forEach(c => { t[c.k] += num(r[c.k]); });
  }
  t.fixed = m.fixed.reduce((s, f) => s + num(f.amount), 0);
  t.net = t.inc + t.sab + t.hot - t.exp - t.fixed;
  return t;
}

function renderHeader() {
  const [y, mo] = view.ym.split('-').map(Number);
  $('mtitle').textContent = new Intl.DateTimeFormat('bn-BD', { month: 'long', year: 'numeric' }).format(new Date(y, mo - 1, 1));
}

function renderHero() {
  const t = totals();
  const big = $('netBig');
  big.textContent = fmt(t.net);
  big.className = 'big ' + classFor(t.net);
  CATS.forEach(c => { $('s-' + c.k).textContent = fmt(t[c.k]); });
  $('sFix').textContent = fmt(t.fixed);
  if (view.ym === T.ym) {
    const tn = dayNet(md().days[T.day] || {});
    const el = $('todayNet');
    el.textContent = fmt(tn);
    el.className = classFor(tn);
  } else {
    $('todayNet').textContent = '—';
    $('todayNet').className = '';
  }
}

function renderTabs() {
  $('tabs').innerHTML = CATS.map(c =>
    `<button type="button" data-cat="${c.k}" aria-pressed="${c.k === view.cat}" style="--c:var(--c-${c.k})"><i></i>${c.n}</button>`
  ).join('');
}

function renderCatHead() {
  const cat = CATS.find(c => c.k === view.cat);
  const m = md(), n = daysIn(view.ym);
  let sum = 0;
  for (let d = 1; d <= n; d++) sum += num((m.days[d] || {})[cat.k]);
  $('catName').textContent = cat.n;
  $('catTotal').textContent = 'মোট ' + fmt(sum);
}

function renderList() {
  const m = md(), n = daysIn(view.ym), cat = CATS.find(c => c.k === view.cat);
  const [y, mo] = view.ym.split('-').map(Number);
  const wdFmt = new Intl.DateTimeFormat('bn-BD', { weekday: 'long' });
  let html = '';
  for (let d = 1; d <= n; d++) {
    const r = m.days[d] || {};
    const isToday = view.ym === T.ym && d === T.day;
    html += `<div class="day ${isToday ? 'today' : ''}">` +
      `<div class="dd"><b>${nf.format(d)}</b><small>${wdFmt.format(new Date(y, mo - 1, d))}</small></div>` +
      `<input type="number" inputmode="decimal" min="0" step="any" data-d="${d}" value="${esc(r[cat.k] ?? '')}" placeholder="০" aria-label="${cat.n}, ${d} তারিখ">` +
      `</div>`;
  }
  $('list').innerHTML = html;
}

function renderFixed() {
  const m = md();
  $('fixList').innerHTML = m.fixed.map((f, i) =>
    `<div class="frow">` +
    `<input type="text" data-fx="${i}" data-k="name" value="${esc(f.name)}" placeholder="খরচের নাম">` +
    `<input type="number" inputmode="decimal" min="0" step="any" data-fx="${i}" data-k="amount" value="${esc(f.amount ?? '')}" placeholder="০">` +
    `<button type="button" class="del" data-del="${i}" aria-label="মুছুন">×</button>` +
    `</div>`
  ).join('') || '<p class="note">এখনও কোনো মাসিক খরচ যোগ করা হয়নি।</p>';
}

function renderAll() {
  renderHeader();
  renderTabs();
  renderCatHead();
  renderList();
  renderHero();
}

$('prev').addEventListener('click', () => { view.ym = shift(view.ym, -1); renderAll(); });
$('next').addEventListener('click', () => { view.ym = shift(view.ym, 1); renderAll(); });

$('tabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-cat]');
  if (!btn) return;
  view.cat = btn.dataset.cat;
  renderTabs();
  renderCatHead();
  renderList();
});

$('list').addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset.d) return;
  const m = md(), d = el.dataset.d;
  m.days[d] = m.days[d] || {};
  m.days[d][view.cat] = el.value;
  save();
  renderCatHead();
  renderHero();
});

$('fixBtn').addEventListener('click', () => { renderFixed(); $('fixDlg').showModal(); });
$('closeFix').addEventListener('click', () => $('fixDlg').close());

$('fixList').addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset.fx) return;
  md().fixed[+el.dataset.fx][el.dataset.k] = el.value;
  save();
  renderHero();
});

$('fixList').addEventListener('click', e => {
  const btn = e.target.closest('[data-del]');
  if (!btn) return;
  md().fixed.splice(+btn.dataset.del, 1);
  save();
  renderFixed();
  renderHero();
});

$('addFix').addEventListener('click', () => {
  md().fixed.push({ name: '', amount: '' });
  save();
  renderFixed();
  renderHero();
  const names = $('fixList').querySelectorAll('input[data-k="name"]');
  if (names.length) names[names.length - 1].focus();
});

renderAll();

</script>
</body>
</html>
